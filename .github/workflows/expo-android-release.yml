# Reusable Android release workflow for Expo React Native apps.
#
# Builds and signs a release AAB via `expo prebuild` + Gradle, optionally promotes it to the
# Play internal track, and attaches it to a draft GitHub Release. Signing itself is handled by
# the CONSUMER's Expo release-signing config plugin (applied during prebuild); this workflow
# only supplies the upload-key credentials via ORG_GRADLE_PROJECT_UPLOAD_* env vars.
#
# Example caller (release.yml, triggered by a v* tag):
#   jobs:
#     android:
#       uses: wysdom-solutions/wysdom-ci/.github/workflows/expo-android-release.yml@v1
#       with: { app-slug: fuzz-noise, package-name: com.wysdomsolutions.fuzznoise }
#       secrets: inherit
name: expo-android-release

on:
  workflow_call:
    inputs:
      app-slug:
        description: Artifact filename prefix, e.g. "fuzz-noise".
        type: string
        required: true
      working-directory:
        description: Directory containing the Expo app.
        type: string
        default: src
      node-version:
        description: Node.js version for actions/setup-node.
        type: string
        default: 22.x
      java-version:
        description: Java (Temurin) version for the Gradle build. Match your Expo SDK / AGP requirement.
        type: string
        default: '17'
      package-name:
        description: Android applicationId (required only when publish-to-play is true).
        type: string
        default: ''
      publish-to-play:
        description: Promote the signed AAB to the Play internal track (tag builds only).
        type: boolean
        default: false
      play-track:
        description: Play track to publish to. Never auto-promote past internal.
        type: string
        default: internal
      version-name:
        description: Optional manual version override forwarded from a workflow_dispatch input.
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      # Resolve + validate the version first so a bad version fails in seconds, before setup.
      # `./` resolves to THIS repo (wysdom-ci) at the ref the reusable workflow was called with.
      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-expo-version
        with:
          working-directory: ${{ inputs.working-directory }}
          input-version: ${{ inputs.version-name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - run: npm ci

      - name: Apply resolved version to app.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/upload.jks"

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle bundleRelease
        working-directory: ${{ inputs.working-directory }}/android
        env:
          # Gradle maps ORG_GRADLE_PROJECT_x -> project property x, which the consumer's
          # release-signing config plugin reads (findProperty('UPLOAD_STORE_FILE'), ...).
          ORG_GRADLE_PROJECT_UPLOAD_STORE_FILE: ${{ runner.temp }}/keystore/upload.jks
          ORG_GRADLE_PROJECT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --build-cache \
            -x lintVitalRelease \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename AAB
        env:
          APP_SLUG: ${{ inputs.app-slug }}
          VERSION: ${{ steps.version.outputs.version }}
          VC: ${{ steps.version.outputs.version-code }}
        run: |
          set -euo pipefail
          OUT="${APP_SLUG}-${VERSION}-vc${VC}.aab"
          mv android/app/build/outputs/bundle/release/app-release.aab "$OUT"
          echo "AAB_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ inputs.working-directory }}/${{ env.AAB_NAME }}
          retention-days: 30

      # Optional Play upload (internal track, tag builds only). fastlane is Google-owned;
      # supply reads SUPPLY_JSON_KEY_DATA from env so the service-account JSON never hits argv.
      - name: Set up Ruby
        if: ${{ inputs.publish-to-play && github.ref_type == 'tag' }}
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: ${{ inputs.publish-to-play && github.ref_type == 'tag' }}
        run: gem install fastlane --no-document

      - name: Upload to Play
        if: ${{ inputs.publish-to-play && github.ref_type == 'tag' }}
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PLAY_TRACK: ${{ inputs.play-track }}
          AAB_NAME: ${{ env.AAB_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "::error::publish-to-play is true but package-name input is empty"
            exit 1
          fi
          fastlane supply \
            --aab "$AAB_NAME" \
            --track "$PLAY_TRACK" \
            --release_status completed \
            --package_name "$PACKAGE_NAME" \
            --skip_upload_metadata --skip_upload_images \
            --skip_upload_screenshots --skip_upload_changelogs

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          AAB_NAME: ${{ env.AAB_NAME }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Automated draft release for $TAG"
          fi
          gh release upload "$TAG" "$AAB_NAME" --clobber
