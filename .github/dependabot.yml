version: 2
updates:
  # Keep the SHA-pinned third-party actions (and any actions/* refs) current. Dependabot
  # updates a pinned SHA + its "# vX.Y.Z" comment together, so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # setup-gradle v6+ bundles a proprietary caching component under Gradle's Terms of Use;
      # stay on the MIT-licensed v5 line unless those terms are accepted.
      - dependency-name: gradle/actions/setup-gradle
        update-types: ["version-update:semver-major"]
